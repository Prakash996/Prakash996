<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 590" role="img" aria-labelledby="about-title about-desc">
  <title id="about-title">About JP Prakash and life beyond code</title>
  <desc id="about-desc">Two glass panels introduce JP's engineering focus and rotate through five hobbies.</desc>
  <defs>
    <linearGradient id="about-bg" x2="1" y2="1"><stop stop-color="#0d0e16"/><stop offset="1" stop-color="#141726"/></linearGradient>
    <linearGradient id="about-border"><stop stop-color="#22d3ee" stop-opacity=".75"/><stop offset=".55" stop-color="#a78bfa" stop-opacity=".4"/><stop offset="1" stop-color="#f472b6" stop-opacity=".7"/></linearGradient>
    <pattern id="about-dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#aab0c7" opacity=".16"/></pattern>
  </defs>
  <style>
    .txt{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;fill:#edf0f8}.soft{fill:#a8aec2}.cyan{fill:#22d3ee}.card{fill:#131622;fill-opacity:.92;stroke:url(#about-border);stroke-width:1.2}.hobby{opacity:0;animation:hobby-loop 20s linear infinite}.h2{animation-delay:-4s}.h3{animation-delay:-8s}.h4{animation-delay:-12s}.h5{animation-delay:-16s}@keyframes hobby-loop{0%,3%{opacity:0;transform:translateX(12px)}6%,17%{opacity:1;transform:translateX(0)}20%,100%{opacity:0;transform:translateX(-10px)}}.ring{animation:ring-turn 14s linear infinite;transform-origin:1027px 468px}@keyframes ring-turn{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){.hobby,.ring{animation:none}.h1{opacity:1}}
  </style>
  <style>.soft{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.h1{opacity:1}</style>
  <rect width="1200" height="590" rx="24" fill="url(#about-bg)"/><rect width="1200" height="590" rx="24" fill="url(#about-dots)"/>
  <rect x="25" y="24" width="565" height="542" rx="18" class="card"/><rect x="610" y="24" width="565" height="542" rx="18" class="card"/>
  <text x="56" y="75" class="txt" font-size="27" font-weight="700">About Me</text><text x="56" y="102" class="soft" font-size="12" letter-spacing="1.5">ENGINEERING WITH CARE, FROM UI TO PLATFORM</text>
  <text x="56" y="151" class="txt" font-size="16"><tspan x="56" dy="0">I'm a frontend-focused software engineer who enjoys</tspan><tspan x="56" dy="25">turning thoughtful design into responsive, dependable</tspan><tspan x="56" dy="25">experiences. My work spans production UI, JavaScript</tspan><tspan x="56" dy="25">and Node.js applications, and enterprise platforms.</tspan><tspan x="56" dy="35">Lately, I'm deepening my React, Next.js, Redux, Tailwind</tspan><tspan x="56" dy="25">CSS, and Vite skills while shaping stronger frontend</tspan><tspan x="56" dy="25">architecture through hands-on projects.</tspan></text>
  <path d="M56 369h505" stroke="#303448"/>
  <g class="txt"><circle cx="72" cy="410" r="14" fill="#172c35"/><text x="72" y="415" text-anchor="middle" class="cyan" font-size="14">01</text><text x="101" y="415" font-size="15" font-weight="620">Frontend Engineering</text><text x="539" y="415" text-anchor="end" class="soft" font-size="12">UI / component systems</text></g>
  <path d="M56 436h505" stroke="#303448"/><g class="txt"><circle cx="72" cy="468" r="14" fill="#242239"/><text x="72" y="473" text-anchor="middle" fill="#c4a7ff" font-size="14">02</text><text x="101" y="473" font-size="15" font-weight="620">UI &amp; Responsive Design</text><text x="539" y="473" text-anchor="end" class="soft" font-size="12">detail at every size</text></g>
  <path d="M56 494h505" stroke="#303448"/><g class="txt"><circle cx="72" cy="526" r="14" fill="#30202d"/><text x="72" y="531" text-anchor="middle" fill="#f7a1ce" font-size="14">03</text><text x="101" y="531" font-size="15" font-weight="620">JavaScript / Node.js Development</text></g>
  <text x="642" y="75" class="txt" font-size="27" font-weight="700">Life Beyond Code</text><text x="642" y="102" class="soft" font-size="12" letter-spacing="1.5">A FEW FAVORITE WAYS TO RESET</text>
  <rect x="642" y="131" width="500" height="280" rx="14" fill="#0d101a" stroke="#2d3144"/>
  <g class="hobby h1">
    <circle cx="712" cy="211" r="43" fill="#102c34" stroke="#22d3ee" stroke-opacity=".55"/><path d="M691 202q0-6 7-6h28q7 0 7 6v20q0 6-7 6h-8l-8 8-8-8h-4q-7 0-7-6z" fill="none" stroke="#6deafa" stroke-width="3"/><path d="M699 212h10m-5-5v10m19-6h.1m7 5h.1" stroke="#6deafa" stroke-width="3" stroke-linecap="round"/>
    <text x="783" y="192" class="txt" font-size="24" font-weight="700">Games</text><text x="783" y="220" class="soft" font-size="14">A good challenge, a fresh perspective.</text>
  </g>
  <g class="hobby h2">
    <circle cx="712" cy="211" r="43" fill="#252039" stroke="#a78bfa" stroke-opacity=".6"/><path d="m712 179 7 19 20 1-16 12 6 19-17-11-17 11 6-19-16-12 20-1z" fill="none" stroke="#c9b5ff" stroke-width="2.5"/>
    <text x="783" y="192" class="txt" font-size="24" font-weight="700">Watching Anime</text><text x="783" y="220" class="soft" font-size="14">Stories, worlds, and art worth revisiting.</text>
  </g>
  <g class="hobby h3">
    <circle cx="712" cy="211" r="43" fill="#32212d" stroke="#f472b6" stroke-opacity=".6"/><path d="M701 189h22l-2 30h-18zm0 7h22m-16-7q-5-8 0-12m10 12q5-8 0-12" fill="none" stroke="#ffabd3" stroke-width="2.5" stroke-linecap="round"/>
    <text x="783" y="192" class="txt" font-size="24" font-weight="700">Food</text><text x="783" y="220" class="soft" font-size="14">Finding joy in a new flavor or favorite meal.</text>
  </g>
  <g class="hobby h4">
    <circle cx="712" cy="211" r="43" fill="#132d2b" stroke="#71e5c0" stroke-opacity=".6"/><circle cx="698" cy="225" r="10" fill="none" stroke="#9af1d8" stroke-width="2.5"/><circle cx="726" cy="225" r="10" fill="none" stroke="#9af1d8" stroke-width="2.5"/><path d="m698 225 10-19 8 19h-18l9-12 19 12-8-19h8" fill="none" stroke="#9af1d8" stroke-width="2.5" stroke-linejoin="round"/>
    <text x="783" y="192" class="txt" font-size="24" font-weight="700">Cycling</text><text x="783" y="220" class="soft" font-size="14">A little fresh air and a longer route.</text>
  </g>
  <g class="hobby h5">
    <circle cx="712" cy="211" r="43" fill="#30291d" stroke="#f0ce76" stroke-opacity=".6"/><path d="M704 232h17m-14-5h12l-2-10 7-7-4-8-8 2-8-2-4 8 7 7z" fill="none" stroke="#f6df9c" stroke-width="2.5" stroke-linejoin="round"/><circle cx="713" cy="195" r="4" fill="#f6df9c"/>
    <text x="783" y="192" class="txt" font-size="24" font-weight="700">Chess</text><text x="783" y="220" class="soft" font-size="14">Quiet strategy, one move at a time.</text>
  </g>
  <text x="662" y="380" class="soft" font-size="11" letter-spacing="1">HOBBY</text><rect x="716" y="371" width="390" height="4" rx="2" fill="#24293a"/>
  <rect x="716" y="371" width="78" height="4" rx="2" fill="#22d3ee" class="hobby h1"/><rect x="794" y="371" width="78" height="4" rx="2" fill="#a78bfa" class="hobby h2"/><rect x="872" y="371" width="78" height="4" rx="2" fill="#f472b6" class="hobby h3"/><rect x="950" y="371" width="78" height="4" rx="2" fill="#71e5c0" class="hobby h4"/><rect x="1028" y="371" width="78" height="4" rx="2" fill="#f0ce76" class="hobby h5"/>
  <text x="642" y="457" class="txt" font-size="14" font-weight="650">A little rhythm for the day</text><text x="642" y="480" class="soft" font-size="12">Create · explore · recharge</text>
  <g fill="none" stroke-width="8"><circle cx="1032" cy="485" r="38" stroke="#292d40"/><circle cx="1032" cy="485" r="38" stroke="#22d3ee" stroke-dasharray="92 147" stroke-linecap="round" class="ring"/><circle cx="1032" cy="485" r="25" stroke="#292d40"/><circle cx="1032" cy="485" r="25" stroke="#a78bfa" stroke-dasharray="56 101" stroke-linecap="round" transform="rotate(-90 1032 485)"/></g>
  <text x="1032" y="490" class="txt" text-anchor="middle" font-size="12" font-weight="700">JP</text>
</svg>