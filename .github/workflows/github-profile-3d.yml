# Generates the 3D contribution "city" using yoshi389111/github-profile-3d-contrib.
# Structure follows the workflow documented in that project's README.
# First run: Actions -> GitHub-Profile-3D-Contrib -> Run workflow.
# Output images are committed under profile-3d-contrib/ (e.g. profile-night-view.svg).
name: GitHub-Profile-3D-Contrib

on:
  schedule: # 03:00 JST == 18:00 UTC (daily refresh)
    - cron: "0 18 * * *"
  workflow_dispatch:

# The job commits the generated images back to this repository.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-profile-3d-contrib
    steps:
      - uses: actions/checkout@v5
      - uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: Prakash996
      - name: Commit & Push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A .
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "generated"
            git push
          fi
