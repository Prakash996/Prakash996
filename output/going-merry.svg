<svg
  viewBox="0 0 800 200"
  xmlns="http://www.w3.org/2000/svg">

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#87CEEB"/>
      <stop offset="100%" stop-color="#BEE7F5"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="800" height="200" fill="url(#sky)"/>

  <!-- Sun -->
  <circle cx="700" cy="40" r="20" fill="#F9D849"/>

  <!-- Ocean -->
  <rect x="0" y="140" width="800" height="60" fill="#1A73BA"/>

  <!-- Animated waves -->
  <path
    d="M0 145 Q20 135 40 145 T80 145 T120 145 T160 145
       T200 145 T240 145 T280 145 T320 145
       T360 145 T400 145 T440 145 T480 145
       T520 145 T560 145 T600 145 T640 145
       T680 145 T720 145 T760 145 T800 145"
    fill="none"
    stroke="#FFFFFF"
    stroke-width="3"
    stroke-dasharray="10 5"
    opacity="0.7">

    <animate
      attributeName="stroke-dashoffset"
      from="0"
      to="30"
      dur="2s"
      repeatCount="indefinite"/>
  </path>

  <!-- Ship -->
  <g id="ship">

    <!-- Hull -->
    <path
      d="M260 125
         L520 125
         L490 155
         L300 155
         Z"
      fill="#8B5A2B"/>

    <!-- Hull bottom -->
    <rect x="300" y="150" width="190" height="8" fill="#5C3B1E"/>

    <!-- Mast -->
    <rect x="375" y="55" width="7" height="75" fill="#5C3B1E"/>

    <!-- Sail -->
    <polygon
      points="382,60 382,115 470,115"
      fill="#F5F5F5"/>

    <!-- Sail shadow -->
    <polygon
      points="382,60 382,115 395,115"
      fill="#D8D8D8"/>

    <!-- Sun emblem -->
    <circle cx="415" cy="92" r="10" fill="#F9D849"/>

    <!-- Flag -->
    <polygon
      points="382,55 420,65 382,72"
      fill="#DF1C24"/>

    <!-- Deck -->
    <rect x="285" y="120" width="220" height="8" fill="#6F431F"/>

    <!-- Cabin -->
    <rect x="450" y="100" width="40" height="25" fill="#9B6A3A"/>
    <rect x="458" y="107" width="10" height="8" fill="#87CEEB"/>

    <!-- Portholes -->
    <circle cx="325" cy="138" r="5" fill="#F9D849"/>
    <circle cx="350" cy="138" r="5" fill="#F9D849"/>
    <circle cx="455" cy="138" r="5" fill="#F9D849"/>

  </g>

  <!-- Ship sailing animation -->
  <animateTransform
    href="#ship"
    attributeName="transform"
    type="translate"
    values="-650 0; 650 0; -650 0"
    dur="12s"
    repeatCount="indefinite"/>

</svg>
