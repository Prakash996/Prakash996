<svg viewBox="0 0 800 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#87CEEB"/>
      <stop offset="100%" stop-color="#BEE7F5"/>
    </linearGradient>
  </defs>

  <rect width="800" height="200" fill="url(#sky)"/>

  <!-- Sun -->
  <circle cx="700" cy="40" r="20" fill="#F9D849"/>

  <!-- Ocean -->
  <rect x="0" y="140" width="800" height="60" fill="#1A73BA"/>
  <path id="wave1" d="M0,140 Q20,130 40,140 T80,140 T120,140 T160,140 T200,140"
        stroke="#ffffff" stroke-width="3" fill="none" opacity="0.6"/>

  <!-- Ship group (animated) -->
  <g id="ship" transform="translate(-100,110)">
    <rect x="0" y="20" width="60" height="15" fill="#8B5A2B"/>      <!-- hull -->
    <rect x="25" y="0" width="4" height="20" fill="#5C3B1E"/>      <!-- mast -->
    <polygon points="29,2 29,18 55,10" fill="#F5F5F5"/>            <!-- sail -->
    <circle cx="40" cy="10" r="4" fill="#F9D849"/>                 <!-- sun emblem on sail -->
    <rect x="0" y="15" width="10" height="8" fill="#DF1C24"/>      <!-- flag/trim -->
  </g>

  <animateTransform xlink:href="#ship" attributeName="transform" type="translate"
    from="-100,110" to="900,110" dur="12s" repeatCount="indefinite"/>
</svg>