<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 830" role="img" aria-labelledby="stack-title stack-desc">
  <title id="stack-title">Technology orbit</title><desc id="stack-desc">React anchors three animated orbits of technologies, with skill chips grouped below.</desc>
  <defs><linearGradient id="stack-bg" x2="1" y2="1"><stop stop-color="#0d0e16"/><stop offset="1" stop-color="#161728"/></linearGradient><linearGradient id="stack-edge"><stop stop-color="#22d3ee"/><stop offset=".5" stop-color="#a78bfa"/><stop offset="1" stop-color="#f472b6"/></linearGradient><pattern id="stack-dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#aab0c7" opacity=".16"/></pattern></defs>
  <style>.txt{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;fill:#eef0f8}.muted{fill:#a8aec2}.chip{fill:#191c2b;stroke:#35394f}.orbit{fill:none;stroke:#536079;stroke-opacity:.42;stroke-width:1.5;stroke-dasharray:5 9;animation:dash 28s linear infinite}.o2{animation-direction:reverse;stroke:#a78bfa;stroke-opacity:.33}.o3{stroke:#f472b6;stroke-opacity:.25;animation-duration:35s}@keyframes dash{to{stroke-dashoffset:280}}.node{animation:bob 4s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}@keyframes bob{to{transform:translateY(-4px)}}.pulse{animation:pulse 3s ease-in-out infinite}@keyframes pulse{50%{opacity:.52}}@media(prefers-reduced-motion:reduce){.orbit,.node,.pulse{animation:none}}</style>
  <style>.moon{transform-box:view-box;transform-origin:600px 286px;animation:moon-orbit 22s linear infinite}.moon-b{animation-duration:29s;animation-direction:reverse}@keyframes moon-orbit{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){.moon{animation:none}}</style>
  <style>.muted{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.moon text{transform-box:fill-box;transform-origin:center;animation:moon-label 22s linear infinite}.moon-b text{animation:moon-label-back 29s linear infinite}@keyframes moon-label{to{transform:rotate(-360deg)}}@keyframes moon-label-back{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){.moon text{animation:none}}</style>
  <rect width="1200" height="830" rx="24" fill="url(#stack-bg)"/><rect width="1200" height="830" rx="24" fill="url(#stack-dots)"/>
  <text x="48" y="53" class="txt" font-size="26" font-weight="700">Tech Stack</text><text x="48" y="78" class="muted" font-size="12" letter-spacing="1.5">TOOLS I BUILD WITH, AND KEEP EXPLORING</text>
  <ellipse cx="600" cy="292" rx="384" ry="120" class="orbit" transform="rotate(-17 600 292)"/><ellipse cx="600" cy="292" rx="324" ry="166" class="orbit o2" transform="rotate(22 600 292)"/><ellipse cx="600" cy="292" rx="260" ry="196" class="orbit o3" transform="rotate(-53 600 292)"/>
  <g class="node"><rect x="230" y="207" width="108" height="36" rx="12" class="chip"/><text x="284" y="230" text-anchor="middle" class="txt" font-size="14">JavaScript</text></g>
  <g class="node"><rect x="842" y="153" width="110" height="36" rx="12" class="chip"/><text x="897" y="176" text-anchor="middle" class="txt" font-size="14">TypeScript</text></g>
  <g class="node"><rect x="226" y="329" width="76" height="36" rx="12" class="chip"/><text x="264" y="352" text-anchor="middle" class="txt" font-size="14">HTML5</text></g>
  <g class="node"><rect x="342" y="115" width="70" height="36" rx="12" class="chip"/><text x="377" y="138" text-anchor="middle" class="txt" font-size="14">CSS3</text></g>
  <g class="node"><rect x="948" y="292" width="76" height="36" rx="12" class="chip"/><text x="986" y="315" text-anchor="middle" class="txt" font-size="14">Angular</text></g>
  <g class="node"><rect x="786" y="399" width="85" height="36" rx="12" class="chip"/><text x="828" y="422" text-anchor="middle" class="txt" font-size="14">Next.js</text></g>
  <g class="node"><rect x="548" y="105" width="70" height="36" rx="12" class="chip"/><text x="583" y="128" text-anchor="middle" class="txt" font-size="14">Redux</text></g>
  <g class="node"><rect x="440" y="412" width="112" height="36" rx="12" class="chip"/><text x="496" y="435" text-anchor="middle" class="txt" font-size="14">Tailwind CSS</text></g>
  <g class="node"><rect x="894" y="366" width="72" height="36" rx="12" class="chip"/><text x="930" y="389" text-anchor="middle" class="txt" font-size="14">GitHub</text></g>
  <g class="node"><rect x="310" y="382" width="54" height="36" rx="12" class="chip"/><text x="337" y="405" text-anchor="middle" class="txt" font-size="14">Git</text></g>
  <circle cx="600" cy="286" r="74" fill="#22d3ee" opacity=".10" class="pulse"/><circle cx="600" cy="286" r="59" fill="#121b28" stroke="url(#stack-edge)" stroke-width="2"/><circle cx="600" cy="286" r="48" fill="none" stroke="#22d3ee" stroke-opacity=".24"/>
  <text x="600" y="280" text-anchor="middle" class="txt" font-size="28" font-weight="800" fill="#61dafb">React</text><text x="600" y="304" text-anchor="middle" class="muted" font-size="11" letter-spacing="1.4">CORE UI</text>
  <g class="moon"><circle cx="540" cy="224" r="24" fill="#211e36" stroke="#a78bfa"/><text x="540" y="228" text-anchor="middle" class="txt" font-size="9" font-weight="700">JS</text></g><g class="moon moon-b"><circle cx="661" cy="346" r="26" fill="#171f37" stroke="#22d3ee"/><text x="661" y="350" text-anchor="middle" class="txt" font-size="9" font-weight="700">TS</text></g>
  <path d="M48 468h1104" stroke="#32364a"/><text x="48" y="504" class="txt" font-size="16" font-weight="700">Beyond the orbit</text>
  <g class="txt" font-size="12">
    <text x="52" y="533" class="muted" font-size="11" letter-spacing="1">FRONTEND</text><rect x="52" y="545" width="515" height="112" rx="12" fill="#131622" stroke="#34384c"/><text x="70" y="572"><tspan x="70">JavaScript · TypeScript · HTML5 · CSS3 · React · Next.js</tspan><tspan x="70" dy="23">Redux · Angular · Tailwind CSS · Bootstrap · jQuery · Vite</tspan><tspan x="70" dy="23">Responsive Web Design · Node.js · Express.js</tspan></text>
    <text x="600" y="533" class="muted" font-size="11" letter-spacing="1">MOTION &amp; PLATFORMS</text><rect x="600" y="545" width="548" height="112" rx="12" fill="#131622" stroke="#34384c"/><text x="618" y="572"><tspan x="618">Motion · CSS animation · SVG / SMIL · Electron.js · NW.js</tspan><tspan x="618" dy="23">HCL Volt Iris · Eclipse Theia · Jenkins · Jira</tspan><tspan x="618" dy="23">Git · GitHub · TestNG · Sikuli · Mocha · Selenium</tspan></text>
    <text x="52" y="693" class="muted" font-size="11" letter-spacing="1">DATA &amp; ENTERPRISE</text><rect x="52" y="705" width="515" height="101" rx="12" fill="#131622" stroke="#34384c"/><text x="70" y="733"><tspan x="70">MySQL · SQLite · HCL Domino</tspan><tspan x="70" dy="23">HCL Enterprise Integrator · LotusScript</tspan></text>
    <text x="600" y="693" class="muted" font-size="11" letter-spacing="1">AI / TOOLS</text><rect x="600" y="705" width="548" height="101" rx="12" fill="#131622" stroke="#34384c"/><text x="618" y="733"><tspan x="618">GitHub Copilot · ChatGPT · Claude AI Agents</tspan><tspan x="618" dy="23">React · Redux Toolkit · Tailwind CSS · Lucide React</tspan></text>
  </g>
</svg>